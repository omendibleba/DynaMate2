# DynaMate2 — recommended conda environment (top-level packages)
#
# Install:
#   conda env create -f environment.yml
#   conda activate dynamate
#
# For exact version pinning (maximum reproducibility), use environment_pinned.yml instead.
#
# External requirement (not pip-installable):
#   PACKMOL binary — required by the packmol_build_system tool.
#   Install from: http://leandro.iqm.unicamp.br/m3g/packmol/home.shtml
#   or via conda:  conda install -c conda-forge packmol
#
# External service (not pip-installable): a running MongoDB instance is
# needed for the FireWorks dispatch demo (Section 5.5), as FireWorks'
# LaunchPad backend. See the "FireWorks dispatch demo" section of README.md
# for a local, no-root setup.
#
# GPU note: MACE simulations require a CUDA-capable GPU.
# mace-torch installs PyTorch as a dependency; CUDA toolkit must match your driver.
#
# GPU + enable_cueq=True (run_nvt_md's default, mace_polar's CuEq acceleration):
# needs an exact, tested combination, not whatever mace-torch pulls in on its
# own. The unpinned latest cuequivariance resolves against a newer cuBLAS than
# an older torch/cu12x build ships, so its compiled ops fail to load and
# silently fall back to a pure-Python path mace-torch's own integration code
# doesn't handle (crashes with "'SegmentedPolynomialNaive' object has no
# attribute 'buffer_num_segments'" on the first real MD step). After
# `conda env create`, in this order:
#   conda activate dynamate
#   pip install torch==2.10.0+cu130 --index-url https://download.pytorch.org/whl/cu130
#   pip install cuequivariance==0.8.0 cuequivariance-torch==0.8.0 cuequivariance-ops-torch-cu12==0.8.0
#   pip install torch==2.10.0+cu130 --index-url https://download.pytorch.org/whl/cu130  # reinstall: the cuequivariance step above can pull in a different torch build
# This is also what docker/ builds the GPU image with (see Dockerfile). torch's
# JIT fuser additionally dlopens libnvrtc-builtins.so.13.0 at runtime from
# site-packages/nvidia/cu13/lib, which isn't on the default library search path;
# add it to LD_LIBRARY_PATH (see run.sh's APPTAINERENV_LD_LIBRARY_PATH for the
# exact path) or the first real MD step will crash even with the above installed.

name: dynamate
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # LLM orchestration stack
    - langchain>=0.3
    - langchain-openai>=0.3
    - langchain-community>=0.3
    - langchain-experimental>=0.3.4  # ShellTool()'s default bash backend needs this
    - langgraph>=0.6
    - langgraph-supervisor>=0.0.29
    - langgraph-checkpoint-sqlite>=3.0
    - python-dotenv>=1.0
    # Web UI (legacy Gradio app, gradio-ui-legacy branch)
    - gradio>=6.0
    # Web UI (FastAPI backend for the React UI, backend/)
    - fastapi>=0.115
    - uvicorn[standard]>=0.30
    - sse-starlette>=2.1
    - python-multipart>=0.0.9
    - httpx>=0.27
    - pytest>=8.0
    # Molecular simulation
    - ase>=3.26
    - mace-torch>=0.3        # also installs PyTorch; choose a CUDA-compatible version
    - rdkit>=2024.9
    - numpy>=1.25
    - matplotlib>=3.8
    # Workflow-management demonstrations (Section 5.4, 5.5)
    - tblite[ase]>=0.4.0     # GFN2-xTB calculator for the convergence-gated MD-to-DFT demo
    - fireworks==2.1.4       # FireWorks dispatch demo; needs a running MongoDB LaunchPad
    - pymongo>=4.6           # FireWorks' MongoDB client
    # Notebook
    - jupyter
    - ipykernel
