# DynaMate2 — GPU runtime environment for the CUDA/MACE compute image.
#
# NOT environment_pinned.yml reused as-is, and NOT its 380-package pip
# section either: four separate CI failures each reproduced the same
# pattern (ResolutionImpossible against packages one after another --
# graph-longrange, then nvidia-cublas-cu12, then packaging, then
# langgraph-checkpoint) trying to jointly resolve that whole snapshot in
# one pip pass. That's strong evidence it was accumulated via many
# sequential `pip install`s in a real, shared research environment over
# time (each install only needing to satisfy constraints at that moment),
# not something guaranteed to resolve simultaneously from a clean start --
# and per the graph-longrange investigation, it also contains packages
# genuinely unrelated to DynaMate2 (confirmed via grep: not imported
# anywhere in this codebase).
#
# Mirrors docker/environment.cpu.yml instead (proven to resolve cleanly on
# the first try): the same flexible (>=) requirements.txt-derived deps,
# minus torch/mace-torch — installed separately in the Dockerfile from
# PyTorch's own cu121 wheel index, the same torch-then-mace-torch pattern
# the CPU image already uses, just pointed at a different index.

name: dynamate2
channels:
  - conda-forge
dependencies:
  - python=3.10
  - packmol
  - pip
  - pip:
    - langchain>=0.3.23
    - langchain-openai>=0.3.12
    - langchain-community>=0.3.16
    - langchain-experimental>=0.3.4
    - langgraph>=0.6.7
    - langgraph-supervisor>=0.0.29
    - langgraph-checkpoint-sqlite>=3.0.3
    - python-dotenv>=1.0.0
    - fastapi>=0.115
    - uvicorn[standard]>=0.30
    - sse-starlette>=2.1
    - python-multipart>=0.0.9
    - httpx>=0.27
    - ase>=3.26.0
    - rdkit>=2024.9.6
    - numpy>=1.25.0
    - matplotlib>=3.8.0
